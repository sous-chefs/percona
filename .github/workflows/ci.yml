---
name: ci

"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.2
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write

  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    env:
      # Finish Git maintenance before Chef copies dependency clones.
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: maintenance.autoDetach
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: gc.autoDetach
      GIT_CONFIG_VALUE_1: 'false'
    strategy:
      matrix:
        os:
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - amazonlinux-2023
          - centos-stream-9
          - centos-stream-10
          - debian-12
          - debian-13
          - oraclelinux-8
          - oraclelinux-9
          - rockylinux-8
          - rockylinux-9
          - rockylinux-10
          - ubuntu-2204
          - ubuntu-2404
        suite:
          - default
          - client-80
          - client-84
          - devel-80
          - devel-84
          - server-80
          - server-84
          - source-80
          - source-84
          - cluster-80
          - cluster-84
          - replication-80
          - replication-84
          - resources-80
          - resources-84
        exclude:
          - os: almalinux-10
            suite: client-80
          - os: almalinux-10
            suite: devel-80
          - os: almalinux-10
            suite: server-80
          - os: almalinux-10
            suite: source-80
          - os: almalinux-10
            suite: cluster-80
          - os: almalinux-10
            suite: replication-80
          - os: almalinux-10
            suite: resources-80
          - os: centos-stream-10
            suite: client-80
          - os: centos-stream-10
            suite: devel-80
          - os: centos-stream-10
            suite: server-80
          - os: centos-stream-10
            suite: source-80
          - os: centos-stream-10
            suite: replication-80
          - os: centos-stream-10
            suite: resources-80
          - os: centos-stream-10
            suite: cluster-80
          - os: debian-13
            suite: client-80
          - os: debian-13
            suite: devel-80
          - os: debian-13
            suite: server-80
          - os: debian-13
            suite: source-80
          - os: debian-13
            suite: cluster-80
          - os: debian-13
            suite: replication-80
          - os: debian-13
            suite: resources-80
          - os: rockylinux-10
            suite: client-80
          - os: rockylinux-10
            suite: devel-80
          - os: rockylinux-10
            suite: server-80
          - os: rockylinux-10
            suite: source-80
          - os: rockylinux-10
            suite: cluster-80
          - os: rockylinux-10
            suite: replication-80
          - os: rockylinux-10
            suite: resources-80
          - os: debian-12
            suite: devel-84
          - os: debian-13
            suite: devel-84
          - os: ubuntu-2204
            suite: devel-84
          - os: ubuntu-2404
            suite: devel-84
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.2
      - name: Install Policyfile
        run: chef install Policyfile.rb
      - name: Isolate Dokken from the runner's MySQL AppArmor profile
        run: |
          profiles=/sys/kernel/security/apparmor/profiles
          if sudo test -r "$profiles" && sudo grep -q '^/usr/sbin/mysqld (' "$profiles"; then
            # The host profile can remain loaded even when its source file is absent.
            printf '%s\n' '/usr/sbin/mysqld { }' | sudo apparmor_parser --remove
          fi
      - name: Dokken
        uses: actionshub/test-kitchen@3.0.0
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}
      - name: Print debug output on failure
        if: failure()
        run: |
          set -x
          sudo journalctl -l --since today
          sudo docker version
          sudo docker info
          KITCHEN_LOCAL_YAML=kitchen.dokken.yml /usr/bin/kitchen exec ${{ matrix.suite }}-${{ matrix.os }} -c "journalctl -l"
