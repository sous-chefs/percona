---
driver:
  name: vagrant

provisioner:
  name: policyfile_zero
  policyfile: Policyfile.rb
  chef_license: accept-no-persist
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true
  data_bags_path: test/integration/data_bags

verifier:
  name: inspec

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: almalinux-10
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: centos-stream-10
  - name: debian-12
  - name: debian-13
  - name: oraclelinux-8
  - name: oraclelinux-9
  - name: rockylinux-8
  - name: rockylinux-9
  - name: rockylinux-10
  - name: ubuntu-22.04
  - name: ubuntu-24.04

x-run_lists:
  default: &default_run_list
    - recipe[test::default]
  client: &client_run_list
    - recipe[test::client]
  server: &server_run_list
    - recipe[test::server]
  source: &source_run_list
    - recipe[test::source]
  replication: &replication_run_list
    - recipe[test::replication]
  cluster: &cluster_run_list
    - recipe[test::cluster]
  resources: &resources_run_list
    - recipe[test::user_database]

x-verifiers:
  default: &default_verifier
    inspec_tests:
      - path: test/integration/default
  server: &server_verifier
    inspec_tests:
      - path: test/integration/server
  resources: &resources_verifier
    inspec_tests:
      - path: test/integration/resources

x-excludes:
  no_80_on_current_only_platforms: &no_80_on_current_only_platforms
    - almalinux-10
    - centos-stream-10
    - debian-13
    - rockylinux-10
  no_84_devel_on_debian_family: &no_84_devel_on_debian_family
    - debian-12
    - debian-13
    - ubuntu-22.04
    - ubuntu-24.04

suites:
  - name: default
    run_list: *default_run_list
    verifier:
      <<: *default_verifier
      inputs:
        version: '8.4'

  - name: client-80
    run_list: *client_run_list
    provisioner:
      named_run_list: client-80
    attributes:
      percona:
        version: '8.0'
    verifier:
      <<: *default_verifier
      inputs:
        version: '8.0'
    excludes: *no_80_on_current_only_platforms

  - name: client-84
    run_list: *client_run_list
    provisioner:
      named_run_list: client-84
    attributes:
      percona:
        version: '8.4'
    verifier:
      <<: *default_verifier
      inputs:
        version: '8.4'

  - name: devel-80
    run_list: *client_run_list
    provisioner:
      named_run_list: devel-80
    attributes:
      percona:
        version: '8.0'
        client:
          install_devel_package: true
    verifier:
      <<: *default_verifier
      inputs:
        version: '8.0'
        devel: true
    excludes: *no_80_on_current_only_platforms

  - name: devel-84
    run_list: *client_run_list
    provisioner:
      named_run_list: devel-84
    attributes:
      percona:
        version: '8.4'
        client:
          install_devel_package: true
    verifier:
      <<: *default_verifier
      inputs:
        version: '8.4'
        devel: true
    excludes: *no_84_devel_on_debian_family

  - name: server-80
    run_list: *server_run_list
    provisioner:
      named_run_list: server-80
    attributes:
      percona:
        version: '8.0'
    verifier:
      <<: *server_verifier
      inputs:
        version: '8.0'
    excludes: *no_80_on_current_only_platforms

  - name: server-84
    run_list: *server_run_list
    provisioner:
      named_run_list: server-84
    attributes:
      percona:
        version: '8.4'
    verifier:
      <<: *server_verifier
      inputs:
        version: '8.4'

  - name: source-80
    run_list: *source_run_list
    provisioner:
      named_run_list: source-80
    attributes:
      percona:
        version: '8.0'
    verifier:
      <<: *server_verifier
      inputs:
        version: '8.0'
        type: 'source'
    excludes: *no_80_on_current_only_platforms

  - name: source-84
    run_list: *source_run_list
    provisioner:
      named_run_list: source-84
    attributes:
      percona:
        version: '8.4'
    verifier:
      <<: *server_verifier
      inputs:
        version: '8.4'
        type: 'source'

  - name: cluster-80
    run_list: *cluster_run_list
    provisioner:
      named_run_list: cluster-80
    attributes:
      percona:
        version: '8.0'
    verifier:
      <<: *server_verifier
      inputs:
        version: '8.0'
        type: 'cluster'
    excludes: *no_80_on_current_only_platforms

  - name: cluster-84
    run_list: *cluster_run_list
    provisioner:
      named_run_list: cluster-84
    attributes:
      percona:
        version: '8.4'
    verifier:
      <<: *server_verifier
      inputs:
        version: '8.4'
        type: 'cluster'

  - name: replication-80
    run_list: *replication_run_list
    provisioner:
      named_run_list: replication-80
    attributes:
      percona:
        version: '8.0'
    verifier:
      <<: *server_verifier
      inputs:
        version: '8.0'
        type: 'replication'
    excludes: *no_80_on_current_only_platforms

  - name: replication-84
    run_list: *replication_run_list
    provisioner:
      named_run_list: replication-84
    attributes:
      percona:
        version: '8.4'
    verifier:
      <<: *server_verifier
      inputs:
        version: '8.4'
        type: 'replication'

  - name: resources-80
    run_list: *resources_run_list
    provisioner:
      named_run_list: resources-80
    attributes:
      percona:
        version: '8.0'
    verifier:
      <<: *resources_verifier
      inputs:
        version: '8.0'
    excludes: *no_80_on_current_only_platforms

  - name: resources-84
    run_list: *resources_run_list
    provisioner:
      named_run_list: resources-84
    attributes:
      percona:
        version: '8.4'
    verifier:
      <<: *resources_verifier
      inputs:
        version: '8.4'
